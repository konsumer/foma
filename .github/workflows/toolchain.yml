# Builds the toolchain image (Dockerfile) and pushes it to Docker Hub as konsumer/foma-toolchain,
# when the Dockerfile changes on main, or when run by hand. Needs the repo secrets DOCKERHUB_USERNAME
# and DOCKERHUB_TOKEN (a Docker Hub access token with write access).
# A firmware made from this template does not need it: delete this file and the Dockerfile, and
# ./fm1 uses the published image.
name: toolchain
on:
  push:
    branches: [main]
    paths: [Dockerfile]
  pull_request:
    paths: [Dockerfile]
  workflow_dispatch:
env:
  IMAGE: konsumer/foma-toolchain
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./fm1 image
      - name: Check that it builds the firmware
        run: ./fm1 build
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - if: github.event_name != 'pull_request'
        run: |
          docker tag "$IMAGE" "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE"
          docker push "$IMAGE:${GITHUB_SHA::7}"
